  <text x="52" y="50" fill="#626873" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="3">FIELD NOTE / 05</text>
  <text x="52" y="112" fill="#f0f1f3" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="680" letter-spacing="-0.8">I don’t want one label.</text>
  <text x="52" y="153" fill="#a8adb6" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="500">I want better questions, sharper tools, and things worth making.</text>
