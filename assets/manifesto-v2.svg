  <text x="54" y="126" fill="#f3f4f6" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="58" font-weight="800" letter-spacing="-2.2">NO SINGLE</text>
  <text x="54" y="190" fill="none" stroke="#f3f4f6" stroke-opacity="0.55" stroke-width="1.4" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="64" font-weight="800" letter-spacing="-2.4">LABEL.</text>

  <text x="58" y="236" fill="#a9aeb8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="560">Better questions. Sharper tools. Things worth making.</text>
  <text x="58" y="270" fill="#6f7580" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15">The point isn’t to fit into one box. It’s to keep finding better intersections.</text>

